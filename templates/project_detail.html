{% extends 'base.html' %}

{% block content %}

<div class="mt-5">

    <h1>{{ project.title }}</h1>

    <img src="{{ project.image.url }}" class="img-fluid mt-3">

    <p class="mt-3">{{ project.description }}</p>

    <p><strong>Tech Stack:</strong> {{ project.tech_stack }}</p>

    <a href="{{ project.github_link }}" target="_blank" class="btn btn-outline-light">
        GitHub
    </a>

    {% if project.live_link %}
    <a href="{{ project.live_link }}" target="_blank" class="btn btn-glow">
        Live Demo
    </a>
    {% endif %}

</div>

{% endblock %}
